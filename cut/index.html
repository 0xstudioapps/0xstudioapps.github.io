<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>0X Cut</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../cutplan.png">
<script>
  // 0X Cut'tan paylaşılan planlardaki QR ve linkin hedefi. Basılmış QR'lar bu adresi taşır; hedef buradan değişir.
  // Mağaza açılınca LIVE = true: Play'e gider, kaynak (pdf / mesaj) Play Console'da UTM ile ayrı görünür.
  var LIVE = false;
  var source = location.search.indexOf('pdf') >= 0 ? 'pdf' : 'message';
  var target = LIVE
    ? 'https://play.google.com/store/apps/details?id=com.zeroxstudio.cutplan&referrer=' +
      encodeURIComponent('utm_source=' + source + '&utm_medium=share&utm_campaign=0xcut')
    : '../';
  location.replace(target);
</script>
<noscript><meta http-equiv="refresh" content="0; url=../"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0c0f; color: #f2f3f5;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #e2783a; font-weight: 700; }
</style>
</head>
<body>
  <a href="../">0X Cut</a>
</body>
</html>
